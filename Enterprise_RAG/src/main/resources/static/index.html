<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业内部智能问答 Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e14'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2334d399' stroke-width='2.5'/%3E%3Cpath d='M16 11v5l4 3' stroke='%2334d399' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a0e14; --panel:#111823; --panel2:#0d1420; --line:#1e2a3a; --line2:#28364a;
    --tx:#e6edf3; --tx2:#93a1b3; --tx3:#6b7a8c;
    --acc:#34d399; --info:#7cc3f0; --warn:#eab308; --err:#f87171;
    --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
    --sans:system-ui,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
  ::selection{background:rgba(52,211,153,.25)}

  header{flex:none;border-bottom:1px solid var(--line);background:rgba(10,14,20,.9);backdrop-filter:blur(8px);z-index:10}
  .head-in{max-width:900px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--panel);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
  .brand h1{font-size:17px;font-weight:700}
  .brand .sub{color:var(--tx3);font-size:12px}
  .status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--tx2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
  .dot.on{background:var(--acc);box-shadow:0 0 6px rgba(52,211,153,.7)}

  .chat{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .chat-in{max-width:900px;margin:0 auto;padding:22px 18px 30px;display:flex;flex-direction:column;gap:18px}

  .msg{display:flex;gap:12px;max-width:100%}
  .avatar{width:34px;height:34px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--mono)}
  .msg.user{flex-direction:row-reverse}
  .msg.user .avatar{background:rgba(124,195,240,.14);border:1px solid rgba(124,195,240,.35);color:var(--info)}
  .msg.bot .avatar{background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.35);color:var(--acc)}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;max-width:calc(100% - 46px);line-height:1.75;font-size:14.5px;word-break:break-word}
  .msg.user .bubble{background:var(--panel2);border-color:var(--line2)}
  .bubble pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:9px 0;color:#d7e0ea;white-space:pre-wrap;word-break:break-word}
  .bubble code{font-family:var(--mono);font-size:13px;background:var(--bg);border-radius:4px;padding:1px 5px;color:var(--info)}
  .bubble li{margin-left:1.4em}
  .bubble p{margin:6px 0}

  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
  .chip{font-family:var(--mono);font-size:11.5px;color:var(--tx2);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
  .chip b{color:var(--acc)}
  .chip.warn b{color:var(--warn)}

  .sources{margin-top:9px;display:flex;flex-wrap:wrap;gap:7px}
  .src{font-size:12px;color:var(--tx2);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;max-width:100%}
  .src b{color:var(--info);font-weight:600}

  .empty{text-align:center;color:var(--tx3);padding:60px 16px}
  .empty .big{font-size:15px;color:var(--tx2);margin-bottom:18px}
  .examples{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .examples button{background:var(--panel);border:1px solid var(--line2);color:var(--tx2);border-radius:20px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:var(--sans);transition:.15s}
  .examples button:hover{border-color:var(--acc);color:var(--acc)}

  .composer{flex:none;border-top:1px solid var(--line);background:rgba(10,14,20,.9);backdrop-filter:blur(8px)}
  .composer-in{max-width:900px;margin:0 auto;padding:14px 18px;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;color:var(--tx);font-family:var(--sans);font-size:15px;padding:11px 13px;min-height:46px;max-height:150px;outline:none;transition:.15s}
  textarea:focus{border-color:var(--acc)}
  textarea::placeholder{color:var(--tx3)}
  .send{flex:none;height:46px;padding:0 20px;border:none;border-radius:10px;background:var(--acc);color:#04140c;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
  .send:hover{background:#48e0ab}
  .send:disabled{opacity:.5;cursor:not-allowed}
  .hint{text-align:center;color:var(--tx3);font-size:12px;padding:8px 0 2px}
  .err{color:var(--err)}
  .thinking{color:var(--tx3);font-size:13px;display:flex;align-items:center;gap:8px}
  .thinking::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

  @media (max-width:560px){
    .brand .sub{display:none}
    .bubble{max-width:calc(100% - 40px)}
    .composer-in{padding:10px 12px}
    .send{padding:0 14px}
  }
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5l3.5 2"/></svg></div>
      <div>
        <h1>企业内部智能问答 Agent</h1>
        <div class="sub">RAG 混合检索 · 基于内部知识库作答</div>
      </div>
    </div>
    <div class="status"><span class="dot on" id="dot"></span><span id="statusText">已连接</span></div>
  </div>
</header>

<main class="chat" id="chat">
  <div class="chat-in" id="chatIn"></div>
</main>

<div class="composer">
  <div class="composer-in">
    <textarea id="input" rows="1" placeholder="请输入你的问题，例如：差旅费报销标准是什么？"></textarea>
    <button class="send" id="send">发送</button>
  </div>
  <div class="hint">回车发送 · Shift+Enter 换行 · 回答基于知识库，仅供参考</div>
</div>

<script>
(function(){
  var chatIn = document.getElementById('chatIn');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var busy = false;

  var EXAMPLES = [
    '差旅费的报销标准是什么？',
    '年假能休多少天？怎么申请？',
    '忘记办公系统密码怎么办？',
    '出差回来几天内需要报销？'
  ];

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderMd(t){
    var code = [];
    t = t.replace(/```([\s\S]*?)```/g, function(_,c){ code.push(c); return '\u0000CODE'+ (code.length-1) +'\u0000'; });
    t = esc(t);
    t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
         .replace(/(^|\n)- (.+)/g, function(m,p,li){ return (p||'') + '<li>'+li+'</li>'; })
         .replace(/`([^`]+)`/g, '<code>$1</code>');
    var lines = t.split('\n');
    t = lines.map(function(l){
      if(/^<li>/.test(l.trim())) return '<ul>'+l.trim()+'</ul>';
      return '<p>'+ (l||'&nbsp;') +'</p>';
    }).join('');
    t = t.replace(/\u0000CODE(\d+)\u0000/g, function(_,i){ return '<pre>'+esc(code[+i])+'</pre>'; });
    return t;
  }

  function appendUser(q){
    var m = document.createElement('div'); m.className='msg user';
    m.innerHTML = '<div class="avatar">你</div><div class="bubble">'+esc(q)+'</div>';
    chatIn.appendChild(m); chatIn.scrollTop = chatIn.scrollHeight;
  }

  function appendThinking(){
    var m = document.createElement('div'); m.className='msg bot';
    m.innerHTML = '<div class="avatar">AI</div><div class="bubble thinking">正在检索知识库并生成回答</div>';
    chatIn.appendChild(m); chatIn.scrollTop = chatIn.scrollHeight; return m;
  }

  function appendBot(data){
    var m = document.createElement('div'); m.className='msg bot';
    var src = (data.sources||[]);
    var srcHtml = src.length ? '<div class="sources">'+src.slice(0,4).map(function(s){
      return '<span class="src"><b>'+esc(s.title||('文档#'+s.docId))+'</b> · 相关度 '+s.score+'</span>';
    }).join('')+'</div>' : '';
    var meta = '<div class="meta">'
      + '<span class="chip"><b>'+esc(data.model||'-')+'</b></span>'
      + '<span class="chip">延迟 <b>'+data.latencyMs+'ms</b></span>'
      + '<span class="chip">命中 <b>'+src.length+'</b> 片段</span>'
      + '<span class="chip">in <b>'+data.promptTokens+'</b> / out <b>'+data.completionTokens+'</b></span>'
      + '</div>';
    m.innerHTML = '<div class="avatar">AI</div><div class="bubble">'+renderMd(data.answer||'')
      + srcHtml + meta + '</div>';
    var t = chatIn.querySelector('.thinking');
    if(t && t.parentElement) t.parentElement.remove();
    chatIn.appendChild(m); chatIn.scrollTop = chatIn.scrollHeight;
  }

  function appendError(msg){
    var t = chatIn.querySelector('.thinking');
    if(t && t.parentElement) t.parentElement.remove();
    var m = document.createElement('div'); m.className='msg bot';
    m.innerHTML = '<div class="avatar">AI</div><div class="bubble err"><b>请求失败：</b>'+esc(msg)+'</div>';
    chatIn.appendChild(m); chatIn.scrollTop = chatIn.scrollHeight;
  }

  function send(q){
    q = (q||'').trim();
    if(!q || busy) return;
    busy = true; sendBtn.disabled = true;
    appendUser(q);
    var t = appendThinking();
    fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(res.j.code===0){ appendBot(res.j.data); }
        else { appendError(res.j.message||('HTTP '+res.ok)); }
      })
      .catch(function(e){ appendError(e.message||'网络错误'); })
      .finally(function(){ busy=false; sendBtn.disabled=false; input.focus(); });
  }

  function init(){
    var e = document.createElement('div'); e.className='empty';
    e.innerHTML = '<div class="big">你好，我是企业内部智能问答助手。<br>我会基于内部知识库检索后作答，并标注引用来源。</div>'
      + '<div class="examples">'+EXAMPLES.map(function(x){return '<button type="button">'+esc(x)+'</button>';}).join('')+'</div>';
    chatIn.appendChild(e);
    chatIn.querySelectorAll('.examples button').forEach(function(b){
      b.addEventListener('click', function(){ send(b.textContent); });
    });
    input.focus();
  }

  sendBtn.addEventListener('click', function(){ send(input.value); input.value=''; });
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(input.value); input.value=''; }
  });
  input.addEventListener('input', function(){
    this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,150)+'px';
  });

  init();
})();
</script>
</body>
</html>
